# mini1 smoke test (50 names) — same as conf_mini1_simple.yaml

qlib_init:
    provider_uri: "/home/ubuntu/chenyuanhengWorkspace/QuantaAlpha/data/qlib/mini1_us_5min"
    region: us

market: &market mini1_smoke50
benchmark: &benchmark SPY

data_handler_config: &data_handler_config
    start_time: 2025-01-02
    end_time: 2026-04-17
    instruments: *market
    data_loader:
        class: NestedDataLoader
        kwargs:
            dataloader_l:
                - class: qlib.contrib.data.loader.QlibDataLoader
                  kwargs:
                    freq: 5min
                    config:
                        feature:
                            - ["$close/Ref($close, 1)-1", "$volume/Mean($volume, 48)"]
                            - ["RET_1", "VOL_RATIO"]
                        label:
                            - ["Ref($close, -2)/Ref($close, -1) - 1"]
                            - ["LABEL0"]
                - class: qlib.data.dataset.loader.StaticDataLoader
                  kwargs:
                    config: "combined_factors_df.parquet"

    learn_processors:
        - class: Fillna
          kwargs:
              fields_group: feature
        - class: DropnaLabel
        - class: CSRankNorm
          kwargs:
              fields_group: feature

    infer_processors:
        - class: Fillna
          kwargs:
              fields_group: feature
        - class: CSRankNorm
          kwargs:
              fields_group: feature

port_analysis_config: &port_analysis_config
    strategy:
        class: TopkDropoutStrategy
        module_path: qlib.contrib.strategy
        kwargs:
            signal: <PRED>
            topk: 10
            n_drop: 2
    backtest:
        start_time: 2026-03-30
        end_time: 2026-04-16
        account: 1000000
        benchmark: *benchmark
        exchange_kwargs:
            codes: *market
            freq: day
            deal_price: close
            open_cost: 0.0005
            close_cost: 0.0015
            min_cost: 1

task:
    model:
        class: LinearModel
        module_path: qlib.contrib.model.linear
        kwargs:
            estimator: ols
            alpha: 0.0
            fit_intercept: false
            include_valid: true

    dataset:
        class: DatasetH
        module_path: qlib.data.dataset
        kwargs:
            handler:
                class: DataHandlerLP
                module_path: qlib.contrib.data.handler
                kwargs: *data_handler_config
            segments:
                train: [2025-01-02, 2026-02-15]
                valid: [2026-02-16, 2026-03-27]
                test: [2026-03-30, 2026-04-17]

    record:
        - class: SignalRecord
          module_path: qlib.workflow.record_temp
          kwargs:
            model: <MODEL>
            dataset: <DATASET>
        - class: SigAnaRecord
          module_path: qlib.workflow.record_temp
          kwargs:
            ana_long_short: False
            ann_scaler: 19656
        - class: PortAnaRecord
          module_path: qlib.workflow.record_temp
          kwargs:
            risk_analysis_freq: day
            config: *port_analysis_config
